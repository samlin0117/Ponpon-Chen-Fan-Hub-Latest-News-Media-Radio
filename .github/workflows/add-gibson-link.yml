name: Diagnose Gibson mentions

on:
  push:
    paths:
      - '.github/gibson-link.trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump Gibson context
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          out = []
          idx = 0
          count = 0
          while True:
              idx = text.find('Gibson', idx)
              if idx == -1:
                  break
              start = max(0, idx - 120)
              end = min(len(text), idx + 120)
              out.append(f'--- Match {count} at pos {idx} ---')
              out.append(repr(text[start:end]))
              out.append('')
              idx += 6
              count += 1

          Path('.github/gibson_debug.txt').write_text('\n'.join(out), encoding='utf-8')
          print(f'Found {count} occurrences of Gibson, wrote debug file')
          PY

      - name: Commit debug file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/gibson_debug.txt
          git rm -f .github/workflows/add-gibson-link.yml .github/gibson-link.trigger
          git commit -m "Diagnostic dump of Gibson mentions in App.tsx"
          git push
