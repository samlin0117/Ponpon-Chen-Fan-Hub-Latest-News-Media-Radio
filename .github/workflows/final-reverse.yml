name: Final reverse order fix

on:
  push:
    paths:
      - '.github/final-reverse.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update filter logic and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')

          new_marker = "if (timelineFilter === 'first') return [...result].reverse();"
          if new_marker in text:
              print('ALREADY_UPDATED')
              exit(0)

          old_block = """const filteredTimelineItems = timelineItems.filter(item => {
    if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
    return item.category === timelineFilter;
  });"""

          new_block = """const filteredTimelineItems = (() => {
    const result = timelineItems.filter(item => {
      if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
      return item.category === timelineFilter;
    });
    if (timelineFilter === 'first') return [...result].reverse();
    return result;
  })();"""

          if old_block not in text:
              print('NEEDLE_NOT_FOUND')
              exit(1)

          text = text.replace(old_block, new_block, 1)
          p.write_text(text, encoding='utf-8')
          print('UPDATED_OK')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git rm -f .github/workflows/final-reverse.yml .github/final-reverse.trigger
          git diff --staged --quiet && echo 'No changes to commit' || (git commit -m "Apply reverse order for first-time filter" && git push origin HEAD:main)
