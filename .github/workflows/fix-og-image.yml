name: Fix OG image

on:
  push:
    paths:
      - '.github/fix-og-image.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update OG/Twitter image in index.html
        run: |
          python3 - <<'PY' > /tmp/py_log.txt 2>&1
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_url = 'https://shoutoutla.s3.us-west-1.amazonaws.com/wp-content/uploads/2024/04/c-PonponChen__IMG5020_1712948629197.jpg'
          new_url = 'https://ponponchenarchive.com/ner-interview-cover.JPG'

          count = text.count(old_url)
          if count == 0:
              if new_url in text:
                  print('index.html: ALREADY UPDATED')
              else:
                  print('index.html: OLD URL NOT FOUND, and new URL not present either')
          else:
              text = text.replace(old_url, new_url)
              p.write_text(text, encoding='utf-8')
              print(f'index.html: UPDATED OK, replaced {count} occurrences')
          PY
          cat /tmp/py_log.txt
          cp /tmp/py_log.txt PY_LOG3.md

      - name: Verify build
        run: |
          set +e
          npm ci > /tmp/build_log.txt 2>&1
          npm run build >> /tmp/build_log.txt 2>&1
          echo "BUILD_EXIT_CODE=$?" >> /tmp/build_log.txt
          cp /tmp/build_log.txt BUILD_LOG3.md
          set -e

      - name: Commit and clean up
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PY_LOG3.md BUILD_LOG3.md 2>/dev/null || true
          git rm -f .github/workflows/fix-og-image.yml .github/fix-og-image.trigger 2>/dev/null || true
          git commit -m "Fix OG/Twitter share image: use local ner-interview-cover.JPG" || true
          git push || true
