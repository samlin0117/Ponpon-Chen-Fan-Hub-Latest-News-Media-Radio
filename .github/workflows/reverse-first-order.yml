name: Reverse first-time filter order v3

on:
  push:
    paths:
      - '.github/reverse-first-order.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update filter logic in App.tsx
        run: |
          python3 - <<'PY' > /tmp/py_log.txt 2>&1
          from pathlib import Path

          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')

          old_block = """const filteredTimelineItems = timelineItems.filter(item => {
    if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
    return item.category === timelineFilter;
  });"""

          new_block = """const filteredTimelineItems = (() => {
    const result = timelineItems.filter(item => {
      if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
      return item.category === timelineFilter;
    });
    if (timelineFilter === 'first') return [...result].reverse();
    return result;
  })();"""

          if new_block in text:
              print('App.tsx: ALREADY UPDATED')
          elif old_block in text:
              text = text.replace(old_block, new_block, 1)
              p.write_text(text, encoding='utf-8')
              print('App.tsx: UPDATED OK')
          else:
              print('App.tsx: NEEDLE NOT FOUND')
              idx = text.find('filteredTimelineItems = timelineItems.filter')
              print(f'pos: {idx}')
              if idx != -1:
                  print(repr(text[max(0,idx-20):idx+350]))
          PY
          cat /tmp/py_log.txt
          cp /tmp/py_log.txt PY_LOG5.md

      - name: Verify build
        run: |
          set +e
          npm ci > /tmp/build_log.txt 2>&1
          npm run build >> /tmp/build_log.txt 2>&1
          echo "BUILD_EXIT_CODE=$?" >> /tmp/build_log.txt
          cp /tmp/build_log.txt BUILD_LOG5.md
          set -e

      - name: Commit and clean up
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx PY_LOG5.md BUILD_LOG5.md 2>/dev/null || true
          git rm -f .github/workflows/reverse-first-order.yml .github/reverse-first-order.trigger 2>/dev/null || true
          git commit -m "Reverse order for first-time filter: newest first (after permission fix)" || true
          git push || true
