name: Dump NEW ALBUM 2026 tag

on:
  push:
    paths:
      - '.github/dump-album-tag.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for NEW ALBUM tag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []
          targets = ['NEW ALBUM', 'newAlbum', 'new_album', 'ALBUM 2026', 'album2026', 'albumFilter', 'newalbum']

          files_to_scan = ['src/App.tsx']
          for root in ['src/components', 'src/data']:
              p = Path(root)
              if p.exists():
                  for f in p.rglob('*.ts*'):
                      files_to_scan.append(str(f))

          for filename in files_to_scan:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for target in targets:
                  idx = 0
                  while True:
                      idx = text.lower().find(target.lower(), idx)
                      if idx == -1:
                          break
                      start = max(0, idx - 100)
                      end = min(len(text), idx + 400)
                      out.append(f'--- {filename} matched "{target}" at pos{idx} ---')
                      out.append(text[start:end])
                      out.append('')
                      idx += len(target)

          Path('DUMP_ALBUM_TAG.md').write_text('\n'.join(out) if out else 'NO MATCHES FOUND', encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_ALBUM_TAG.md
          git rm -f .github/workflows/dump-album-tag.yml .github/dump-album-tag.trigger
          git commit -m "Diagnostic: dump NEW ALBUM 2026 tag location"
          git push
