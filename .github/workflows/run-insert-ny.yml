name: Direct Insert NY Event to App

on:
  push:

permissions:
  contents: write

jobs:
  run_insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run insertion script
        run: python3 scripts/insert_ny_final.py

      - name: Cleanup temporary files
        run: |
          rm -f scripts/insert_ny_final.py
          rm -f .github/workflows/run-insert-ny.yml

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Insert Ponpon New York first public performance event" && git push origin HEAD:main)
