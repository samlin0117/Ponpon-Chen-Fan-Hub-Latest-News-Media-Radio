name: Apply NY Event Direct

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert New York Event into App.tsx
        run: |
          python3 - <<'EOF'
          with open('src/App.tsx', 'r', encoding='utf-8') as f:
              text = f.read()

          item_code = """  {
              year: '2026年8月',
              title: '首次紐約公開演出',
              category: 'first',
              desc: "在紐約知名爵士俱樂部 Birdland Theater 登上《Frank Vignola's Guitar Night》舞台擔任特邀嘉賓，帶來吉他、歌聲與口哨即興演奏。",
              links: [
                { text: '點此觀看演出精華', url: 'https://www.youtube.com/watch?v=gUXx6-WK-V0' }
              ]
            },
          """

          if '首次紐約公開演出' not in text:
              marker = "const timelineItems: TimelineItem[] = ["
              if marker in text:
                  text = text.replace(marker, marker + "\n" + item_code, 1)
                  with open('src/App.tsx', 'w', encoding='utf-8') as f:
                      f.write(text)
                  print("SUCCESS_INSERTED")
              else:
                  print("MARKER_NOT_FOUND")
                  exit(1)
          else:
              print("ALREADY_EXISTS")
          EOF

      - name: Cleanup temporary workflow
        run: |
          rm -f .github/workflows/apply-ny-event.yml

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Add Ponpon New York first public performance to timeline" && git push origin HEAD:main)
