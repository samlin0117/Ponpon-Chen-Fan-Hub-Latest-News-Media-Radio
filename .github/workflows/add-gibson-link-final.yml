name: Add Gibson link final

on:
  push:
    paths:
      - '.github/gibson-final.trigger'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix locale files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gibson_url = 'https://www.gibson.com/blogs/gibson-gazette/ponpon-joins-the-gibson-artist-spotlight-program'
          link_open = f"<a href='{gibson_url}' target='_blank' rel='noopener noreferrer' class='text-gold hover:text-gold-light hover:underline transition-colors'>"

          zh_old = '受邀擔任 <strong>Gibson</strong> 2026 年度焦點藝術家，展現'
          zh_new = f'受邀擔任 {link_open}<strong>Gibson</strong> 2026 年度焦點藝術家</a>，展現'

          en_broken = 'inviting her to be <a href="https://www.gibson.com/blogs/gibson-gazette/ponpon-joins-the-gibson-artist-spotlight-program" target="_blank" rel="noopener noreferrer" class="text-gold hover:text-gold-light hover:underline transition-colors"><strong>Gibson</strong>\'s 2026 Spotlight Artist</a>, showcasing'
          en_original = "inviting her to be <strong>Gibson</strong>'s 2026 Spotlight Artist, showcasing"
          en_new = f"inviting her to be {link_open}<strong>Gibson</strong>'s 2026 Spotlight Artist</a>, showcasing"

          ja_broken = '<a href="https://www.gibson.com/blogs/gibson-gazette/ponpon-joins-the-gibson-artist-spotlight-program" target="_blank" rel="noopener noreferrer" class="text-gold hover:text-gold-light hover:underline transition-colors"><strong>Gibson</strong>の2026年度注目アーティスト</a>に選出。'
          ja_original = '<strong>Gibson</strong>の2026年度注目アーティストに選出。'
          ja_new = f'{link_open}<strong>Gibson</strong>の2026年度注目アーティスト</a>に選出。'

          p = Path('src/locales/zh.json')
          text = p.read_text(encoding='utf-8')
          if zh_new in text:
              print('zh.json already correct, skipping')
          elif zh_old in text:
              text = text.replace(zh_old, zh_new, 1)
              p.write_text(text, encoding='utf-8')
              print('zh.json fixed')
          else:
              raise SystemExit(f'zh.json needle still not found: {zh_old!r}')

          p = Path('src/locales/en.json')
          text = p.read_text(encoding='utf-8')
          if en_new in text:
              print('en.json already correct, skipping')
          elif en_broken in text:
              text = text.replace(en_broken, en_new, 1)
              p.write_text(text, encoding='utf-8')
              print('en.json fixed (was broken with double quotes)')
          elif en_original in text:
              text = text.replace(en_original, en_new, 1)
              p.write_text(text, encoding='utf-8')
              print('en.json updated fresh')
          else:
              raise SystemExit('en.json: neither broken nor original text found')

          p = Path('src/locales/ja.json')
          text = p.read_text(encoding='utf-8')
          if ja_new in text:
              print('ja.json already correct, skipping')
          elif ja_broken in text:
              text = text.replace(ja_broken, ja_new, 1)
              p.write_text(text, encoding='utf-8')
              print('ja.json fixed (was broken with double quotes)')
          elif ja_original in text:
              text = text.replace(ja_original, ja_new, 1)
              p.write_text(text, encoding='utf-8')
              print('ja.json updated fresh')
          else:
              raise SystemExit('ja.json: neither broken nor original text found')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/locales/zh.json src/locales/en.json src/locales/ja.json
          git rm -f .github/workflows/add-gibson-link-v4.yml .github/workflows/add-gibson-link-final.yml .github/gibson-final.trigger REPLACE_LOG.md BUILD_ERROR.md 2>/dev/null || true
          git commit -m "Add Gibson link to 2026 milestone (fixed quoting)"
          git push
