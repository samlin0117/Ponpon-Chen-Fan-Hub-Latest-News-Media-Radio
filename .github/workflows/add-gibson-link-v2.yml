name: Add Gibson link v2

on:
  push:
    paths:
      - '.github/gibson-link-v2.trigger'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Gibson link to locale files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gibson_url = 'https://www.gibson.com/blogs/gibson-gazette/ponpon-joins-the-gibson-artist-spotlight-program'
          link_open = f'<a href="{gibson_url}" target="_blank" rel="noopener noreferrer" class="text-gold hover:text-gold-light hover:underline transition-colors">'

          zh_old = '受邀擅任 <strong>Gibson</strong> 2026 年度焦點藝術家，展現'
          zh_new = f'受邀擅任 {link_open}<strong>Gibson</strong> 2026 年度焦點藝術家</a>，展現'

          en_old = "inviting her to be <strong>Gibson</strong>'s 2026 Spotlight Artist, showcasing"
          en_new = f"inviting her to be {link_open}<strong>Gibson</strong>'s 2026 Spotlight Artist</a>, showcasing"

          ja_old = '<strong>Gibson</strong>の2026年度注目アーティストに選出。'
          ja_new = f'{link_open}<strong>Gibson</strong>の2026年度注目アーティスト</a>に選出。'

          jobs = [
              ('src/locales/zh.json', zh_old, zh_new),
              ('src/locales/en.json', en_old, en_new),
              ('src/locales/ja.json', ja_old, ja_new),
          ]

          for filename, old, new in jobs:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'{filename} already updated, skipping')
                  continue
              if old not in text:
                  raise SystemExit(f'Needle not found in {filename}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{filename} updated')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/locales/zh.json src/locales/en.json src/locales/ja.json
          git rm -f .github/workflows/add-gibson-link-v2.yml .github/gibson-link-v2.trigger GIBSON_DEBUG.md
          git commit -m "Add Gibson link to 2026 milestone"
          git push
