name: Add Martin Taylor endorsement

on:
  push:
    paths:
      - '.github/martin-taylor.trigger'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update endorsement files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          if 'Martin Taylor Card' in text:
              print('App.tsx already has Martin Taylor card, skipping')
          else:
              marker = '                {/* Paul Krugman Card */}'
              if marker not in text:
                  raise SystemExit('Paul Krugman Card marker not found in App.tsx')
              block_lines = [
                  '                {/* Martin Taylor Card */}',
                  '                <div className="relative p-8 md:p-10 rounded-2xl border border-gold/20 bg-gradient-to-br from-gold/5 via-dark-lighter to-dark-lighter backdrop-blur-sm overflow-hidden group hover:border-gold/40 transition-all duration-500 mb-8">',
                  '                  <div className="absolute top-4 right-6 text-gold/10 text-8xl font-serif select-none leading-none">"</div>',
                  '                  <div className="absolute bottom-0 left-0 w-48 h-48 bg-gold/5 rounded-full blur-[80px] -ml-12 -mb-12"></div>',
                  '                  <div className="relative z-10">',
                  '                    <div className="flex items-center gap-3 mb-6">',
                  '                      <div className="inline-flex items-center gap-2 px-4 py-1.5 bg-gold/10 border border-gold/30 rounded-full">',
                  '                        <Music className="w-3.5 h-3.5 text-gold" />',
                  '                        <span className="text-xs font-mono text-gold-light tracking-[0.2em] uppercase">{(t as any).endorsement?.martin_subtitle}</span>',
                  '                      </div>',
                  '                      <span className="px-3 py-1 bg-gold text-dark text-xs font-bold tracking-widest rounded-full">NEW</span>',
                  '                    </div>',
                  '                    <div className="mb-5">',
                  '                      <h3 className="text-2xl md:text-3xl font-serif text-white mb-1">{(t as any).endorsement?.martin_name}</h3>',
                  '                      <p className="text-sm text-gold/80 tracking-widest uppercase">{(t as any).endorsement?.martin_title}</p>',
                  '                    </div>',
                  '                    <p className="text-gray-300 leading-relaxed text-base md:text-lg font-light mb-8 text-left">',
                  '                      {(t as any).endorsement?.martin_desc}',
                  '                    </p>',
                  '                    <div className="flex flex-col sm:flex-row gap-3">',
                  '                      <a',
                  '                        href="https://www.thestandard.com.hk/artcan/article/339157/Martin-Taylor-The-lone-arranger-who-uses-one-guitar-to-create-multi-layered-soundscape"',
                  '                        target="_blank"',
                  '                        rel="noopener noreferrer"',
                  '                        className="inline-flex items-center gap-2 px-5 py-2.5 border border-white/10 rounded-xl text-sm text-gray-300 hover:text-gold hover:border-gold/50 transition-all duration-300 group/link"',
                  '                      >',
                  '                        <ArrowRight className="w-4 h-4 group-hover/link:translate-x-0.5 transition-transform" />',
                  '                        <span>{(t as any).endorsement?.martin_date} {(t as any).endorsement?.read_article}</span>',
                  '                      </a>',
                  '                    </div>',
                  '                  </div>',
                  '                </div>',
                  '',
              ]
              block = '\n'.join(block_lines)
              app.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
              print('App.tsx updated with Martin Taylor card')

          entries = {
              'zh.json': {
                  'martin_subtitle': 'SOLO GUITAR',
                  'martin_name': 'Martin Taylor',
                  'martin_title': '英國爵士吉他大師、MBE 勳章得主',
                  'martin_desc': '被譽為當代最傑出的獨奏爵士吉他手之一的 Martin Taylor，曾在接受香港《The Standard》專訪時特別提及台灣吉他手 Ponpon Chen，形容她「非常特別」，而且「懂爵士」；並打趣地說，她令他聯想到觀音——穿著長裙、靜靜站立，讓吉他自己說話。',
                  'martin_date': '2026-08-05'
              },
              'en.json': {
                  'martin_subtitle': 'SOLO GUITAR',
                  'martin_name': 'Martin Taylor',
                  'martin_title': 'British Jazz Guitar Legend, MBE',
                  'martin_desc': "Hailed as one of today's greatest exponents of solo jazz guitar, Martin Taylor recently praised Taiwanese guitarist Ponpon Chen in an interview with Hong Kong's The Standard, describing her as \"very special\" and someone who \"understands jazz.\" He joked that she reminds him of Guanyin \u2014 standing still in a long dress, letting the guitar speak.",
                  'martin_date': '2026-08-05'
              },
              'ja.json': {
                  'martin_subtitle': 'SOLO GUITAR',
                  'martin_name': 'Martin Taylor',
                  'martin_title': '英国ジャズギターの巨匠、MBE勲章受章者',
                  'martin_desc': '現代最高峰の独奏ジャズギタリストの一人と称される Martin Taylor は、香港の「The Standard」のイコレンニーで台湾のギタリスト Ponpon Chen について言及し、「とても特別」で「ジャズを理解している」と評した。また彼女が観音様を思わせると冒談交じりに語り、長いドレスを身にまとい静かに立ち、ギターそのものに語らせている姿を称賛した。',
                  'martin_date': '2026-08-05'
              }
          }
          for filename, data in entries.items():
              p = Path('src/locales') / filename
              s = p.read_text(encoding='utf-8')
              if '"martin_name"' in s:
                  print(f'{filename} already has martin_name, skipping')
                  continue
              needle = '    "page_desc":'
              idx = s.find(needle)
              if idx == -1:
                  raise SystemExit(f'Insertion point not found: {filename}')
              line_end = s.find('\n', idx)
              insert_text = ''
              for k, v in data.items():
                  insert_text += f'    "{k}": ' + json.dumps(v, ensure_ascii=False) + ',\n'
              s = s[:idx] + insert_text + s[idx:]
              p.write_text(s, encoding='utf-8')
              print(f'{filename} updated with Martin Taylor entries')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/locales/zh.json src/locales/en.json src/locales/ja.json
          git rm -f .github/workflows/add-martin-taylor.yml .github/martin-taylor.trigger
          git commit -m "Add Martin Taylor endorsement"
          git push
