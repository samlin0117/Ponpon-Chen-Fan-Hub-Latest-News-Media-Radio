name: Dump news article array

on:
  push:
    paths:
      - '.github/dump-news-array.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for news array structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []
          text = Path('src/App.tsx').read_text(encoding='utf-8')

          out.append('=== Search for "newsArticles" or "articles" array definitions ===')
          for keyword in ['newsArticles', 'newsData', 'articleImages', 'article10', 'articles =', 'newsItems']:
              idx = text.find(keyword)
              out.append(f'{keyword}: found at pos {idx}')

          out.append('')
          idx = text.find('article10')
          if idx != -1:
              start = max(0, idx - 1500)
              end = min(len(text), idx + 500)
              out.append('=== Context around article10 ===')
              out.append(text[start:end])

          out.append('')
          idx = text.find('article7')
          if idx != -1:
              start = max(0, idx - 300)
              end = min(len(text), idx + 300)
              out.append('=== Context around article7 (working image, for comparison) ===')
              out.append(text[start:end])

          Path('DUMP_NEWS_ARR.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_NEWS_ARR.md
          git rm -f .github/workflows/dump-news-array.yml .github/dump-news-array.trigger
          git commit -m "Diagnostic: dump news article array structure"
          git push
