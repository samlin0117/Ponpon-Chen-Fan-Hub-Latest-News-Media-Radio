name: Dump first-time filter data

on:
  push:
    paths:
      - '.github/dump-first-filter.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for first-time filter button and entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []
          text = Path('src/App.tsx').read_text(encoding='utf-8')

          idx = text.find("timelineFilter === 'first'")
          out.append('=== Context around first filter button in App.tsx ===')
          if idx != -1:
              start = max(0, idx - 400)
              end = min(len(text), idx + 400)
              out.append(text[start:end])

          out.append('')
          out.append('=== All category:first entries in zh.json (full context) ===')
          zh = Path('src/locales/zh.json').read_text(encoding='utf-8')
          for m in re.finditer(r'\{\s*"year":[^}]*?"category"\s*:\s*"first"\s*\}', zh, re.DOTALL):
              out.append(m.group(0))
              out.append('---')

          Path('DUMP_FIRST_FILTER.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_FIRST_FILTER.md
          git rm -f .github/workflows/dump-first-filter.yml .github/dump-first-filter.trigger
          git commit -m "Diagnostic: dump first-time filter data"
          git push
