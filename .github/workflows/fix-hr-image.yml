name: Fix Heaven Raven cover image

on:
  push:
    paths:
      - '.github/fix-hr-image.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update image src in App.tsx
        run: |
          python3 - <<'PY' > /tmp/py_log.txt 2>&1
          from pathlib import Path

          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')

          old_block = '''src="https://heavenraven.com/wp-content/uploads/2025/08/IMG_20250802_COVER-1024x1024.jpg"
                          onError={(e) => {
                            // Fallback robust image link (Shoutout LA photo) if original link fails
                            e.currentTarget.src = "https://shoutoutla.s3.us-west-1.amazonaws.com/wp-content/uploads/2024/04/c-PonponChen__IMG5020_1712948629197.jpg";
                          }}'''

          new_block = '''src="/heavenraven-cover.JPG"'''

          if old_block in text:
              text = text.replace(old_block, new_block, 1)
              p.write_text(text, encoding='utf-8')
              print('App.tsx: UPDATED OK')
          elif '/heavenraven-cover.JPG' in text:
              print('App.tsx: ALREADY UPDATED')
          else:
              print('App.tsx: NEEDLE NOT FOUND')
              idx = text.find('heavenraven.com')
              print(f'heavenraven.com found at pos: {idx}')
              if idx != -1:
                  print(repr(text[max(0,idx-200):idx+400]))
          PY
          cat /tmp/py_log.txt
          cp /tmp/py_log.txt PY_LOG.md

      - name: Verify build
        run: |
          set +e
          npm ci > /tmp/build_log.txt 2>&1
          npm run build >> /tmp/build_log.txt 2>&1
          echo "BUILD_EXIT_CODE=$?" >> /tmp/build_log.txt
          cp /tmp/build_log.txt BUILD_LOG.md
          set -e

      - name: Commit and clean up
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx PY_LOG.md BUILD_LOG.md 2>/dev/null || true
          git rm -f .github/workflows/fix-hr-image.yml .github/fix-hr-image.trigger 2>/dev/null || true
          git commit -m "Fix Heaven Raven news cover image: use local asset instead of dead external links" || true
          git push || true
