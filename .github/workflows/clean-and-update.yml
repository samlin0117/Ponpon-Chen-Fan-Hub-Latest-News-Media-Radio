name: Clean workflows and update App

on:
  push:
    paths:
      - '.github/apply-fix.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update src/App.tsx filter logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          content = p.read_text(encoding='utf-8')
          
          old_needle = """const filteredTimelineItems = timelineItems.filter(item => {
    if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
    return item.category === timelineFilter;
  });"""
          
          new_needle = """const filteredTimelineItems = (() => {
    const result = timelineItems.filter(item => {
      if (timelineFilter === 'all') return item.category !== 'first' && item.category !== 'album';
      return item.category === timelineFilter;
    });
    if (timelineFilter === 'first') return [...result].reverse();
    return result;
  })();"""
          
          if old_needle in content:
              content = content.replace(old_needle, new_needle, 1)
              p.write_text(content, encoding='utf-8')
              print("App.tsx updated successfully.")
          elif "if (timelineFilter === 'first') return [...result].reverse();" in content:
              print("App.tsx is already updated.")
          else:
              print("Warning: Needle not found, skipping App.tsx replace")
          PY

      - name: Clean stale workflows and trigger files
        run: |
          rm -f .github/workflows/add-gibson-link-v2.yml
          rm -f .github/workflows/add-gibson-link-v3.yml
          rm -f .github/workflows/reverse-first-fast.yml
          rm -f .github/workflows/final-reverse.yml
          rm -f .github/final-reverse.trigger
          rm -f .github/fast-reverse.trigger
          rm -f .github/apply-fix.trigger
          rm -f .github/workflows/clean-and-update.yml

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Update first-time timeline order to reverse and clean workflows" && git push origin HEAD:main)
