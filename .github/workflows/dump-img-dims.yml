name: Dump image dimensions

on:
  push:
    paths:
      - '.github/dump-img-dims.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow and check dims
        run: |
          pip install Pillow > /dev/null 2>&1
          python3 - <<'PY'
          from PIL import Image
          img = Image.open('public/ner-interview-cover.JPG')
          print(f'Size: {img.size}')
          print(f'Mode: {img.mode}')
          w, h = img.size
          print(f'Aspect ratio (w/h): {w/h:.3f}')
          with open('DUMP_IMG_DIMS.md', 'w') as f:
              f.write(f'Size: {img.size}\nMode: {img.mode}\nAspect: {w/h:.3f}\n')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_IMG_DIMS.md
          git rm -f .github/workflows/dump-img-dims.yml .github/dump-img-dims.trigger
          git commit -m "Diagnostic: dump image dimensions"
          git push
