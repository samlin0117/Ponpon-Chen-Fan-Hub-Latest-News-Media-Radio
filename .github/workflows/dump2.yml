name: Dump Gibson context v2

on:
  push:
    paths:
      - '.github/dump2.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean README and search locale files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          content = re.sub(r'\n*<!-- DEBUG START -->.*?<!-- DEBUG END -->\n*', '', content, flags=re.DOTALL)
          readme.write_text(content, encoding='utf-8')

          out = []
          for filename in ['src/App.tsx', 'src/locales/zh.json', 'src/locales/en.json', 'src/locales/ja.json']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              idx = 0
              count = 0
              while True:
                  idx = text.find('Gibson', idx)
                  if idx == -1:
                      break
                  start = max(0, idx - 100)
                  end = min(len(text), idx + 100)
                  out.append(f'{filename} MATCH{count}: ' + repr(text[start:end]))
                  idx += 6
                  count += 1
              out.append(f'{filename}: total {count} occurrences')
              out.append('')

          debug = Path('GIBSON_DEBUG.md')
          debug.write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md GIBSON_DEBUG.md
          git rm -f .github/workflows/dump2.yml .github/dump2.trigger
          git commit -m "Debug v2: search Gibson in all locale files, clean README"
          git push
