name: Add Gibson link v4

on:
  push:
    paths:
      - '.github/gibson-link-v4.trigger'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Gibson link to locale files
        run: |
          python3 - <<'PY' > /tmp/replace_log.txt 2>&1 || true
          from pathlib import Path

          gibson_url = 'https://www.gibson.com/blogs/gibson-gazette/ponpon-joins-the-gibson-artist-spotlight-program'
          link_open = f'<a href="{gibson_url}" target="_blank" rel="noopener noreferrer" class="text-gold hover:text-gold-light hover:underline transition-colors">'

          zh_old = '受邀擅任 <strong>Gibson</strong> 2026 年度焦點藝術家，展現'
          zh_new = f'受邀擅任 {link_open}<strong>Gibson</strong> 2026 年度焦點藝術家</a>，展現'

          en_old = "inviting her to be <strong>Gibson</strong>'s 2026 Spotlight Artist, showcasing"
          en_new = f"inviting her to be {link_open}<strong>Gibson</strong>'s 2026 Spotlight Artist</a>, showcasing"

          ja_old = '<strong>Gibson</strong>の2026年度注目アーティストに選出。'
          ja_new = f'{link_open}<strong>Gibson</strong>の2026年度注目アーティスト</a>に選出。'

          jobs = [
              ('src/locales/zh.json', zh_old, zh_new),
              ('src/locales/en.json', en_old, en_new),
              ('src/locales/ja.json', ja_old, ja_new),
          ]

          results = []
          for filename, old, new in jobs:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  results.append(f'{filename}: ALREADY UPDATED')
                  continue
              if old not in text:
                  results.append(f'{filename}: NEEDLE NOT FOUND')
                  results.append(f'  needle repr: {old!r}')
                  continue
              text2 = text.replace(old, new, 1)
              p.write_text(text2, encoding='utf-8')
              results.append(f'{filename}: UPDATED OK')

          for r in results:
              print(r)
          PY
          cat /tmp/replace_log.txt
          cp /tmp/replace_log.txt REPLACE_LOG.md

      - name: Commit log and any changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add REPLACE_LOG.md src/locales/zh.json src/locales/en.json src/locales/ja.json
          git rm -f .github/gibson-link-v4.trigger || true
          git commit -m "Diagnostic: replace log"
          git push
