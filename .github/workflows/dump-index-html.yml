name: Dump index.html for favicon/OG check

on:
  push:
    paths:
      - '.github/dump-index-html.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump index.html and check assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          out = []
          text = Path('index.html').read_text(encoding='utf-8')
          out.append('=== FULL index.html ===')
          out.append(text)

          out.append('')
          out.append('=== public/ directory (favicon files) ===')
          for f in sorted(Path('public').glob('favicon*')):
              out.append(f'{f}: size={f.stat().st_size}')

          out.append('')
          out.append('=== public/CNAME content ===')
          cname = Path('public/CNAME')
          if cname.exists():
              out.append(cname.read_text(encoding='utf-8'))

          Path('DUMP_INDEX_HTML.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_INDEX_HTML.md
          git rm -f .github/workflows/dump-index-html.yml .github/dump-index-html.trigger
          git commit -m "Diagnostic: dump index.html favicon/OG setup"
          git push
