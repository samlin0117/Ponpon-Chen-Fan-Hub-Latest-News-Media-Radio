name: Dump tour card text en ja

on:
  push:
    paths:
      - '.github/dump-tour-card.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for tour card text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []
          for filename in ['src/locales/en.json', 'src/locales/ja.json']:
              text = Path(filename).read_text(encoding='utf-8')
              out.append(f'=== {filename} ===')
              for m in re.finditer(r'\{\s*"year":\s*"[^"]*2026[^"]*"[^}]*?\}', text, re.DOTALL):
                  out.append(m.group(0))
                  out.append('---')
              out.append('')

          Path('DUMP_TOUR_CARD.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_TOUR_CARD.md
          git rm -f .github/workflows/dump-tour-card.yml .github/dump-tour-card.trigger
          git commit -m "Diagnostic: dump en/ja tour card text"
          git push
