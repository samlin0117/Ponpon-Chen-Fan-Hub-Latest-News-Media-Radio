name: Restore and Re-add NY Item

on:
  push:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Revert App.tsx to commit 754e69b and properly insert NY item
        run: |
          # 1. 恢復到未改前的乾淨完整檔案
          git checkout 754e69b -- src/App.tsx

          # 2. 插入紐約新項目
          python3 - <<'EOF'
          with open('src/App.tsx', 'r', encoding='utf-8') as f:
              text = f.read()

          item_code = """  {
              year: '2026年8月',
              title: '首次紐約公開演出',
              category: 'first',
              desc: "在紐約知名爵士俱樂部 Birdland Theater 登上《Frank Vignola's Guitar Night》舞台擔任特邀嘉賓，帶來吉他、歌聲與口哨即興演奏。",
              links: [
                { text: '點此觀看演出精華', url: 'https://www.youtube.com/watch?v=gUXx6-WK-V0' }
              ]
            },
          """

          marker = "const timelineItems: TimelineItem[] = ["
          if marker in text and '首次紐約公開演出' not in text:
              text = text.replace(marker, marker + "\n" + item_code, 1)
              with open('src/App.tsx', 'w', encoding='utf-8') as f:
                  f.write(text)
              print("INSERT_SUCCESS")
          else:
              print("MARKER_STATUS:", marker in text)
          EOF

      - name: Cleanup temporary workflow
        run: |
          rm -f .github/workflows/restore-app.yml

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "Restore original full App.tsx style and add NY event" && git push origin HEAD:main)
