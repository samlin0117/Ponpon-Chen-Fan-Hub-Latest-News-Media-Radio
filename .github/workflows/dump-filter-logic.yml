name: Dump timeline filter logic

on:
  push:
    paths:
      - '.github/dump-filter-logic.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for filter logic and categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []

          text = Path('src/App.tsx').read_text(encoding='utf-8')

          idx = text.find('timelineFilter')
          out.append('=== All timelineFilter occurrences in App.tsx ===')
          seen = set()
          i = 0
          while True:
              i = text.find('timelineFilter', i)
              if i == -1:
                  break
              start = max(0, i - 60)
              end = min(len(text), i + 120)
              snippet = text[start:end]
              if snippet not in seen:
                  seen.add(snippet)
                  out.append(snippet.replace(chr(10), ' | '))
              i += 14

          out.append('')
          out.append('=== category: values in App.tsx ===')
          for m in re.finditer(r"category\s*[:=]\s*['\"](\w+)['\"]", text):
              out.append(m.group(0))

          out.append('')
          out.append('=== category values in zh.json ===')
          zh = Path('src/locales/zh.json').read_text(encoding='utf-8')
          cats = set(re.findall(r'"category"\s*:\s*"(\w+)"', zh))
          out.append(str(cats))

          out.append('')
          out.append('=== milestone entries with year 2026 or 2025 (zh.json) with full context ===')
          for m in re.finditer(r'\{\s*"year":\s*"(202[56])"[^}]*?"category"\s*:\s*"(\w+)"\s*\}', zh, re.DOTALL):
              out.append(m.group(0)[:500])
              out.append('---')

          Path('DUMP_FILTER.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_FILTER.md
          git rm -f .github/workflows/dump-filter-logic.yml .github/dump-filter-logic.trigger
          git commit -m "Diagnostic: dump filter logic and categories"
          git push
