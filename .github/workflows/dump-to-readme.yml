name: Dump Gibson context to README

on:
  push:
    paths:
      - '.github/dump.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append Gibson context to README
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text(encoding='utf-8')

          out = []
          idx = 0
          count = 0
          while True:
              idx = text.find('Gibson', idx)
              if idx == -1:
                  break
              start = max(0, idx - 100)
              end = min(len(text), idx + 100)
              out.append(f'MATCH{count}: ' + repr(text[start:end]))
              idx += 6
              count += 1

          readme = Path('README.md')
          content = readme.read_text(encoding='utf-8')
          content += '\n\n<!-- DEBUG START -->\n' + '\n'.join(out) + '\n<!-- DEBUG END -->\n'
          readme.write_text(content, encoding='utf-8')
          print(f'Found {count} occurrences')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm -f .github/workflows/dump-to-readme.yml .github/dump.trigger
          git commit -m "Debug: dump Gibson context to README"
          git push
