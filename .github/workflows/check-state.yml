name: Check current filter state

on:
  push:
    paths:
      - '.github/check-state.trigger'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check current state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/App.tsx').read_text(encoding='utf-8')
          idx = text.find('filteredTimelineItems = ')
          out = text[max(0,idx-10):idx+700] if idx != -1 else 'NOT FOUND'
          Path('CHECK_STATE.md').write_text(out, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHECK_STATE.md
          git rm -f .github/workflows/check-state.yml .github/check-state.trigger .github/reverse-first-order.trigger .github/workflows/reverse-first-order.yml 2>/dev/null || true
          git commit -m "Check current filteredTimelineItems state and clean stale files"
          git push
