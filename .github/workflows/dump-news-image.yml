name: Dump Heaven Raven news image info

on:
  push:
    paths:
      - '.github/dump-news-image.trigger'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Search for Heaven Raven news entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          out = []

          for filename in ['src/App.tsx']:
              text = Path(filename).read_text(encoding='utf-8')
              idx = text.find('Heaven Raven')
              out.append(f'--- {filename}: Heaven Raven found at pos {idx} ---')
              if idx != -1:
                  start = max(0, idx - 500)
                  end = min(len(text), idx + 500)
                  out.append(text[start:end])
              out.append('')

          zh = Path('src/locales/zh.json').read_text(encoding='utf-8')
          idx = zh.find('Heaven Raven')
          out.append(f'--- zh.json: Heaven Raven found at pos {idx} ---')
          if idx != -1:
              start = max(0, idx - 800)
              end = min(len(zh), idx + 400)
              out.append(zh[start:end])

          out.append('')
          out.append('=== src/assets directory listing ===')
          assets = Path('src/assets')
          if assets.exists():
              for f in sorted(assets.rglob('*')):
                  out.append(str(f))

          out.append('')
          out.append('=== public directory listing (if exists) ===')
          public = Path('public')
          if public.exists():
              for f in sorted(public.rglob('*')):
                  out.append(str(f))

          Path('DUMP_NEWS_IMG.md').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DUMP_NEWS_IMG.md
          git rm -f .github/workflows/dump-news-image.yml .github/dump-news-image.trigger
          git commit -m "Diagnostic: dump Heaven Raven news image info"
          git push
