    <!--
      在 React 載入前先把網址整理好，避免畫面閃動：
      1. 還原 404.html 編碼過的深層路徑 (/?/news -> /news)
      2. 把舊的 HashRouter 連結轉成新路徑 (/#/news -> /news)
      3. 把舊的 ?lang= 連結轉成語言路徑 (/about?lang=en -> /en/about)
      4. 把常見的誤用前綴 /jp 轉成日文的 /ja (/jp/videos -> /ja/videos)
    -->
    <script type="text/javascript">
      (function () {
        var l = window.location;

        // 1. 還原 404.html 轉進來的路徑 (第一個 & 還原成 ?)
        if (l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }

        // 2. 舊 HashRouter 連結轉址 (向後相容已分享出去的 #/ 網址)
        if (l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, '', l.hash.slice(1));
        }

        // 3. 舊的 ?lang=en / ?lang=ja 轉成語言路徑。
        //    這裡必須真的重新載入，才能拿到該語言預先產生的靜態 HTML。
        var path = l.pathname;
        var seg = path.split('/')[1];
        if (seg !== 'en' && seg !== 'ja') {
          var m = l.search.match(/[?&]lang=(en|ja)\b/);
          if (m) {
            var rest = path === '/' ? '' : path.replace(/\/$/, '');
            var query = l.search.replace(/([?&])lang=(zh|en|ja)\b&?/, '$1').replace(/[?&]$/, '');
            l.replace('/' + m[1] + rest + (query === '?' ? '' : query) + l.hash);
          }
        }

        // 4. /jp 不是語言代碼（日文是 ja），但很常被猜成日文版網址。
        //    一樣要重新載入，才能拿到 /ja 預先產生的靜態 HTML。
        if (seg === 'jp') {
          var jaRest = path.slice(3).replace(/\/$/, '');
          l.replace('/ja' + jaRest + l.search + l.hash);
        }
      })();
    </script>
