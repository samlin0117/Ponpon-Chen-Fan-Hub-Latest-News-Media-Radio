    <!--
      在 React 載入前先把網址整理好，避免畫面閃動：
      1. 還原 404.html 編碼過的深層路徑 (/?/news -> /news)
      2. 把舊的 HashRouter 連結轉成新路徑 (/#/news -> /news)
    -->
    <script type="text/javascript">
      (function () {
        var l = window.location;

        // 1. 還原 404.html 轉進來的路徑 (第一個 & 還原成 ?)
        if (l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
          return;
        }

        // 2. 舊 HashRouter 連結轉址 (向後相容已分享出去的 #/ 網址)
        if (l.hash.indexOf('#/') === 0) {
          var hashPath = l.hash.slice(1); // 保留開頭的 "/"，含可能的 ?lang=
          window.history.replaceState(null, '', hashPath);
        }
      })();
    </script>
