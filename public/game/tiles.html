<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ponpon Pairs｜Ponpon 公仔對對碰</title>
  <meta name="description" content="Ponpon 公仔對對碰：點兩張一樣的牌就會消除，在時間內全部消完就過關。" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="img/ponpon-avatar.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/tiles.css" />
</head>
<body>
  <div id="app">
    <!-- 首頁 -->
    <section id="screen-title" class="screen active">
      <div class="lang-switch">
        <button type="button" data-lang="zh">中</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日</button>
      </div>
      <div class="title-body">
        <img class="tiles-art" src="img/ponpon-figure.webp" alt="Ponpon" width="800" height="800" />
        <h1 class="title">
          <span class="title-main">Ponpon</span>
          <span class="title-sub" data-i18n="subtitle"></span>
        </h1>
        <ul class="how">
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
        </ul>
        <button type="button" id="btn-start" class="btn-primary" data-i18n="start"></button>
        <p class="hint" id="title-best"></p>
      </div>
      <footer class="credit">
        <span data-i18n="credit"></span><br />
        <a id="back-to-site" href="/" data-i18n="backToSite"></a>
      </footer>
    </section>

    <!-- 遊戲畫面 -->
    <section id="screen-game" class="screen">
      <header class="bar">
        <button type="button" id="btn-pause" class="btn-icon" data-i18n-label="paused">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" /><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" /></svg>
        </button>
        <div class="bar-mid">
          <b id="level-label"></b>
          <small id="score-label"></small>
        </div>
        <div class="time" id="time-box"><b id="time-label"></b></div>
      </header>
      <div class="time-track" id="time-track"><i id="time-fill"></i></div>
      <div class="board-wrap">
        <div class="board" id="board"></div>
        <div class="banner" id="banner"></div>
      </div>
      <footer class="tools">
        <button type="button" id="btn-hint" class="tool"><span data-i18n="hint"></span><b id="hint-n"></b></button>
        <button type="button" id="btn-shuffle" class="tool"><span data-i18n="shuffle"></span><b id="shuffle-n"></b></button>
      </footer>
      <div class="overlay" id="overlay-pause">
        <div class="panel">
          <h2 data-i18n="paused"></h2>
          <button type="button" id="btn-resume" class="btn-primary" data-i18n="resume"></button>
          <button type="button" id="btn-restart" class="btn" data-i18n="retry"></button>
          <button type="button" id="btn-quit" class="btn" data-i18n="quit"></button>
        </div>
      </div>
      <div class="overlay" id="overlay-end">
        <div class="panel">
          <h2 id="end-title"></h2>
          <p class="end-score" id="end-score"></p>
          <div class="new-best" id="end-newbest" data-i18n="newBest"></div>
          <button type="button" id="btn-retry" class="btn-primary"></button>
          <button type="button" id="btn-home" class="btn" data-i18n="quit"></button>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="js/tiles.js"></script>
</body>
</html>
